name: Paper 1 R2 calculation rules
on:
  pull_request:
    paths:
      - 'paper1_r2/**'
      - 'tests/paper1_r2/**'
      - 'data/paper1_r2/**'
      - 'requirements-paper1-r2.txt'
      - '.github/workflows/paper1-r2-rules.yml'
  push:
    branches: [main]
    paths:
      - 'paper1_r2/**'
      - 'tests/paper1_r2/**'
      - 'data/paper1_r2/**'
      - 'requirements-paper1-r2.txt'
      - '.github/workflows/paper1-r2-rules.yml'
permissions:
  contents: read
jobs:
  test-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-paper1-r2.txt
      - run: python -m pytest -q tests/paper1_r2
