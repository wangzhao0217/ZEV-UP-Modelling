name: Paper 1 R2 calculation checks
on:
  push:
    branches: [main, reproducibility/paper1-r2-minimal]
    paths:
      - 'paper1_r2/**'
      - 'tests/test_paper1_*.py'
      - 'examples/**'
      - 'reference/**'
      - 'reproduce.py'
      - 'verify_packaged_paper1_r2.py'
      - 'requirements-r2.txt'
      - 'transfer_manifest.json'
      - '.github/workflows/paper1-r2-checks.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transferred numerical sources and reference files
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('transfer_manifest.json').read_text())
          records = manifest['code'] + manifest['reference_tables'] + manifest['support_files']
          for item in records:
              actual = hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()
              assert actual == item['sha256'], f"Checksum mismatch: {item['path']}: {actual}"
          print(f'Checked {len(records)} file fingerprints')
          PY
      - run: python -m pip install -r requirements-r2.txt
      - name: Run original numerical regression assertions
        run: python -m pytest -q tests/test_paper1_feasibility.py tests/test_paper1_charging.py tests/test_paper1_scenarios.py tests/test_paper1_chaining.py
      - name: Exercise four-case runner with fictional inputs
        run: python reproduce.py --flows examples/synthetic_flows.csv --stations examples/synthetic_stations.csv --output build/synthetic_results.csv
